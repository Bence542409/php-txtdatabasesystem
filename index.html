        <h2><a href="https://www.icloud.com/shortcuts/7dd24b00cc1b441dbde7f4c2a60a030c" target="_blank" class="button">Siri Támogatás</a></h2>
        <script>
document.addEventListener('keydown', function(event) {
    // Ne aktiválódjon, ha a felhasználó éppen egy űrlap mezőben gépel
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName)) {
        return;
    }

    // A lenyomott billentyű kisbetűssé alakítása, így a Caps Lock nem okoz gondot
    switch(event.key.toLowerCase()) {
        case 'c': window.location.href = 'id-check.php'; break;
        case 's': window.location.href = 'id-search.php'; break;
        case 'a': window.location.href = 'id-add.php'; break;
        case 'm': window.location.href = 'id-modify.php'; break;
        case 'r': window.location.href = 'id-remove.php'; break;
        case 'd': window.location.href = 'id-data.php'; break;
        case 'l': window.location.href = 'id-location.php'; break;
    }
});
</script>
